# O-MicroAD Olink Explore HT analysis - settings
# Paths are relative to the repository root.

paths:
  manifest: data/manifest.xlsx                          # Olink sample submission sheet (sheet "manifest" is the master)
  npx_dir: data/npx                                     # folder with the Olink *.parquet file(s)
  leip_clinical: data/LEIP_clinical_parameters_n35.xlsx # optional; sheet "Key_parameters"
  fixed_lod: data/Explore_HT_Fixed_LOD.csv              # optional; Olink fixed LOD file (";"-separated, version >= 6.0.0)
  hpa: data/reference/proteinatlas.tsv.zip              # optional; Human Protein Atlas download for tissue origin (step 17) - see tools/download_hpa.R
  severity: data/severity.xlsx                          # optional; columns SubjectID, Visit (V1..V6 or 1..6) + numeric scores (e.g. SCORAD, EASI, NRS)
  output: output

# Which NPX column to analyse. PCNormalizedNPX is required here: plate 1 is ISF only,
# plate 2 mixed and plates 3-4 serum, so intensity normalisation would be distorted.
npx_column: PCNormalizedNPX

qc:
  lod_method: auto            # auto = Olink fixed LOD file if present, else NC-based LOD from the 8 negative controls
  drop_sample_qc_warn: false  # keep samples with SampleQC = WARN (they are flagged)
  drop_assay_qc_warn: false   # keep assay/plate results with AssayQC = WARN (they are flagged)
  min_detect_frac: 0.5        # keep an assay in a matrix if >= 50% of samples are above LOD in at least one group
  outlier_sd: 3               # sample outlier: median or IQR beyond mean +/- 3 SD (Olink QC plot rule)
  drop_outliers: false        # flag only; set true after reviewing the QC plots
  low_volume_ul: {ISF: 20, Serum: 40}

stats:
  fdr: 0.05
  min_group_n: 3              # skip a contrast if a group has fewer samples than this
  min_rel_log2: 1             # step 10: minimum relative dISF/serum difference (log2) to call a protein enriched
  visit_min_subjects: 5        # step 13: analyse a visit only if >= this many AD patients
  cores: 4                    # parallel workers for the mixed models (1 = serial)

# Pre-specified proteins for the dedicated analysis (step 12). Olink assay name (gene symbol),
# OlinkID or UniProt. CD137 / 4-1BB = TNFRSF9; its ligand 4-1BBL = TNFSF9 can be added.
focus_proteins: ["TNFRSF9", "TNFSF9", "KITLG", "CPA4", "FCER1A", "TPSAB1", "MS4A2", "TPSD1", "PNOC", "POSTN"]

export:                       # step 19: CSV export of the Olink data
  sep: ","                    # use ";" for German Excel (then the decimal mark is ",")
  long_format: true           # also write one long table (all samples x proteins, gzip-compressed)

# Key questions (step 15)
key_questions:
  mast_cell_markers: ["KITLG", "CPA4", "FCER1A", "TPSAB1", "MS4A2", "TPSD1", "CPA3", "CMA1", "KIT", "HDC"]   # combined into a mast cell score
  proteins: ["TNFRSF9", "TNFSF9"]                                             # CD137 and its ligand
  bootstrap: 2000                                                             # resamples for AUC confidence intervals

enrichment:
  collections: ["H", "C2:CP:REACTOME", "C5:GO:BP"]
  min_size: 10
  max_size: 500

# Step 16: which proteins correlate with TNFRSF9 (4-1BB / CD137) in dISF?
tnfrsf9_correlation:
  anchor: TNFRSF9
  targets: ["IL33", "IL4", "CSF2", "IL6", "IL18", "CXCL8", "IL1RL1", "KIT", "KITLG", "TPSAB1", "TPSB2", "FCER1A"]
  main_targets: ["IL33", "IL4"]   # scatter plots and highlighted in the summary
  min_n: 5                        # minimum number of sample pairs for a correlation

# Step 17: do serum and dISF carry the same or different signatures? (MicroAD only; RELAD/RELAD2/LEIP not used)
signatures:
  collections: ["C2:CP:REACTOME", "C5:GO:BP"]   # over-representation against the assayed panel
  min_size: 5
