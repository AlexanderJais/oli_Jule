# LEIP galanin study - settings.
# Paths are relative to the project folder (the one with oli_Jule.Rproj). The input files are the
# same as for the dISF/serum analysis; the LEIP samples are in the Olink serum file.

paths:
  npx_dir: data/npx                                       # Olink NPX parquet file(s); files without LEIP samples are skipped
  fixed_lod: data/Explore_HT_Fixed_LOD.csv                # Olink fixed LOD file (recommended; else LOD from negative controls)
  leip_clinical: data/LEIP_clinical_parameters_n35.xlsx   # sheet Key_parameters (+ All_SORB_parameters); defines the LEIP samples
  manifest: data/manifest.xlsx                            # optional: cross-check of SubjectIDs
  output: leip_galanin/output

npx_column: PCNormalizedNPX   # plate-control normalised NPX, as in the main analysis
min_detect_frac: 0.5          # a protein counts as measurable if >= 50% of the LEIP samples are above LOD
drop_failed_samples: true     # samples with Olink SampleQC = FAIL are left out (WARN is kept and flagged)
fdr: 0.05
seed: 20260927
bootstrap: 2000               # resamples for bootstrap confidence intervals
permutations: 1000            # permutations for the protein-profile comparison of Olink GAL and ELISA

galanin:
  olink_assay: GAL                   # Olink assay (gene symbol); UniProt P22466, the galanin precursor
  elisa_column: "Galanin [pg/mL]"    # ELISA column in the clinical file

# Column names of the clinical file are used in plain ASCII: the micro sign becomes u (Ins0_uU_ml),
# umlauts lose their dots (lipamisch). sex_MF becomes sex_male (1 = M, 0 = F), the ELISA galanin_elisa.
covariates: ["age", "sex_male", "plate"]    # "adjusted" analyses (partial Spearman); plate = Olink plate

# 3: galanin and HDL
hdl:
  lipids: ["C_HDL", "c_apo", "C_LDL", "C_CHOL", "C_TRIGLY", "C_APO_B", "C_LIPO"]   # lab lipids (HDL-C and ApoA-I first)
  hdl: C_HDL                 # HDL cholesterol
  apoa1: c_apo               # ApoA-I (lab)
  comparisons: [["C_HDL", "C_LDL"], ["C_HDL", "C_TRIGLY"], ["c_apo", "C_APO_B"], ["c_apo", "C_HDL"]]   # is galanin closer to the first?
  adjust_extra: ["age", "BMI"]   # second adjustment set: sex + these
  # Olink proteins on HDL particles (from HDL proteomics) and comparators on other lipoproteins
  hdl_proteins: ["APOA1", "APOA2", "APOA4", "APOM", "LCAT", "PON1", "PON3", "CLU", "APOD", "APOE", "APOF", "APOH",
                 "APOL1", "PLTP", "SAA4", "SERPINA1", "AMBP", "TTR", "CETP", "APOC1", "APOC3", "SCARB1"]
  other_lipoprotein_proteins: ["APOB", "LPA", "PCSK9", "ANGPTL3", "LPL", "LDLR"]
  score_proteins: ["APOA1", "APOA2", "APOM", "LCAT", "PON1", "PON3"]   # "HDL protein score" (mean z of those measured)

# 2: galanin correlates - proteins stored and released with galanin (dense-core vesicles, neuroendocrine cells)
neuroendocrine_proteins: ["CHGA", "CHGB", "SCG2", "SCG3", "SCG5", "VGF", "CPE", "PCSK1", "PCSK2", "NPY", "PENK", "PDYN",
                          "TAC1", "SST", "CALCA", "CARTPT", "GHRL", "PYY", "GCG", "POMC", "AGRP", "CRH", "OXT", "DBH"]
gsea:
  run: true
  collections: ["H", "C2:CP:REACTOME", "C5:GO:BP"]
  min_size: 10
  max_size: 500

# 1: validation - other proteins measured both by the lab (column of the clinical file) and by Olink
lab_vs_olink:
  galanin_elisa: GAL
  c_apo: APOA1
  C_APO_B: APOB
  C_LIPO: LPA
  c_AFABP4: FABP4
  Progranulin: GRN
  c_chemerin: RARRES2
  Vaspin0min: SERPINA12
  c_FGF21: FGF21
  IL10: IL10
  c_tsh: TSHB
  c_adiponectin: ADIPOQ
  c_CRP: CRP
  c_IGF1: IGF1
  BMP2: BMP2
  serum_irisin: FNDC5
  Ins0_uU_ml: INS
  c_AGF: ANGPTL6

# 4 (supplementary): every measurable protein vs every clinical variable
clinical:
  min_n: 20        # a variable needs >= this many LEIP samples with a value
  min_group: 5     # ... and >= this many samples that differ from its most common value
  # coarsened copies of other variables (BMI group, tertiles, yes/no versions of scores): not tested
  exclude: ["g_BMI_group_1", "NGT_Glu0", "Vaspin0_tertile", "NGT_Vas_tert", "RE_BIN", "c_DIS_BIN", "HUNG_BIN",
            "C_LIPO_norm", "g_alc_binary2", "Proteinurie_ja_nein"]
expected_associations:   # sanity checks: associations known from population proteomics
  - {protein: LEP,    parameter: BMI,       direction: positive}
  - {protein: LEP,    parameter: c_fett,    direction: positive}
  - {protein: LEP,    parameter: sex_male,  direction: negative}
  - {protein: FABP4,  parameter: BMI,       direction: positive}
  - {protein: IGFBP2, parameter: BMI,       direction: negative}
  - {protein: IGFBP1, parameter: HOMA_IR,   direction: negative}
  - {protein: CST3,   parameter: MDRD_kurz, direction: negative}
  - {protein: B2M,    parameter: MDRD_kurz, direction: negative}
  - {protein: GDF15,  parameter: age,       direction: positive}
  - {protein: EDA2R,  parameter: age,       direction: positive}
  - {protein: KLK3,   parameter: sex_male,  direction: positive}
  - {protein: APOA1,  parameter: c_apo,     direction: positive}
